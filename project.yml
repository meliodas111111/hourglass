# XcodeGen spec — generates Hourglass.xcodeproj.
#   brew install xcodegen && xcodegen generate
# Every value marked  ▶ MANUAL  must be adjusted before shipping (see README → "Manual setup").

name: Hourglass
options:
  bundleIdPrefix: com.meliodas                      # ▶ MANUAL: your reverse-DNS prefix
  deploymentTarget:
    iOS: "15.0"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""                           # ▶ MANUAL: your Team ID
    CODE_SIGN_STYLE: Automatic
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    # Xcode 26: don't generate Swift symbols from catalog keys ("Reset all data" and "Reset all data?" would collide).
    STRING_CATALOG_GENERATE_SYMBOLS: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO              # Crashlytics dSYM upload script needs it
    DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
  configs:
    Release:
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

packages:
  HourglassCore:
    path: Packages/HourglassCore
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    from: 12.0.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    from: 3.0.0
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: 11.0.0

targets:

  # ───────────────────────────────────────────── App
  Hourglass:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: App
        excludes: ["**/*.md", "Resources/Configuration.storekit"]
      - path: App/Resources/Configuration.storekit
        buildPhase: none                           # referenced by the scheme only, not bundled
      - path: Shared
    dependencies:
      - package: HourglassCore
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
      - package: Firebase
        product: FirebaseCrashlytics
      - package: Firebase
        product: FirebaseAnalytics
      - target: HourglassWidgets
        embed: true
        codeSign: true
    entitlements:
      path: App/Hourglass.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.meliodas.hourglass             # ▶ MANUAL: App Group (also in AppGroup.swift)
        # Time Sensitive Notifications: requires a paid Apple Developer account (Personal Teams can't sign it).
        # With a paid team, uncomment:
        # com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hourglass
        CFBundleLocalizations: [en, fr, de, hi, it, ja, ko, pl, pt, ru, zh-Hans, es, tr]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CADisableMinimumFrameDurationOnPhone: true  # allow 120 Hz on ProMotion iPhones
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: false
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.meliodas.hourglass
            CFBundleURLSchemes: [hourglass]
        # Permission strings (English fallback; localized in InfoPlist.xcstrings)
        NSMotionUsageDescription: "Motion data lets the sand fall with real gravity and lets you start the timer by flipping your device."
        NSUserTrackingUsageDescription: "Allowing tracking lets us show more relevant ads in the free version. You can say no and the app works the same."
        NSAlarmKitUsageDescription: "Alarms make sure your timer rings even in Silent mode or with Focus on."
        # Google Mobile Ads
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511   # ▶ MANUAL: AdMob App ID (this is Google's TEST id)
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
          - SKAdNetworkIdentifier: 4fzdc2evr5.skadnetwork
          - SKAdNetworkIdentifier: 2fnua5tdw4.skadnetwork
          - SKAdNetworkIdentifier: ydx93a7ass.skadnetwork
          - SKAdNetworkIdentifier: p78axxw29g.skadnetwork
        # Firebase — anonymous only
        FirebaseAutomaticScreenReportingEnabled: false
        GOOGLE_ANALYTICS_ADID_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_IDFV_COLLECTION_ENABLED: false
        GOOGLE_ANALYTICS_DEFAULT_ALLOW_AD_PERSONALIZATION_SIGNALS: false
        # Custom keys read by the app
        HGSupporterProductID: com.meliodas.hourglass.supporter              # ▶ MANUAL: IAP product id
        HGBannerAdUnitID: ca-app-pub-3940256099942544/2435281174           # ▶ MANUAL: AdMob banner unit (TEST id)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meliodas.hourglass                   # ▶ MANUAL
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES   # Mac (Designed for iPad)
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES    # visionOS (Designed for iPad)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MTL_FAST_MATH: YES
        OTHER_LDFLAGS: ["-ObjC"]
    postBuildScripts:
      - name: Upload Crashlytics dSYM
        basedOnDependencyAnalysis: false
        script: |
          # Skips silently when GoogleService-Info.plist is not added yet.
          if [ -f "${PROJECT_DIR}/App/Resources/GoogleService-Info.plist" ] && [ "${CONFIGURATION}" = "Release" ]; then
            "${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${TARGET_NAME}
          - ${BUILT_PRODUCTS_DIR}/${INFOPLIST_PATH}

  # ───────────────────────────────────────────── Widgets + Live Activity
  HourglassWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Widget
      - path: Shared
    dependencies:
      - package: HourglassCore
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widget/HourglassWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.meliodas.hourglass             # ▶ MANUAL
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Hourglass
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meliodas.hourglass.widgets            # ▶ MANUAL
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES

  # ───────────────────────────────────────────── UI tests
  HourglassUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Hourglass
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meliodas.hourglass.uitests
        TEST_TARGET_NAME: Hourglass

schemes:
  Hourglass:
    build:
      targets:
        Hourglass: all
        HourglassWidgets: all
    run:
      config: Debug
      storeKitConfiguration: App/Resources/Configuration.storekit
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - HourglassUITests
        - package: HourglassCore/HourglassCoreTests
    profile:
      config: Release
    archive:
      config: Release
